server {
    listen 80;
    server_name localhost;
    
    # 1. CORRECTION : Pointez vers le répertoire partagé via le volume
    root /var/www/html/public;
    
    # 2. Ajout de index.php pour les requêtes racine
    index index.php index.html index.htm; 

    # 3. Gère les requêtes sans fichier spécifié (comme http://localhost/)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. BLOC CLÉ : Envoie tous les fichiers .php à PHP-FPM
    location ~ \.php$ {
        # Vérifie que le fichier existe réellement
        try_files $uri =404; 
        
        # Passe la requête au service 'php' sur le port 9000
        fastcgi_pass php:9000; 
        
        fastcgi_index index.php;
        include fastcgi_params;
        
        # Définit le chemin absolu du script dans le conteneur PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}